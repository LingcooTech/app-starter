name: Docker Verify

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'docker/**'
      - 'server/**'
      - 'admin/**'
      - 'web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Verify Docker image build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: app-starter:verify
          build-args: |
            APP_VERSION=${{ github.event.pull_request.head.sha || github.sha }}
