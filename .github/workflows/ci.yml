name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lingcoo_app
          POSTGRES_USER: lingcoo_app
          POSTGRES_PASSWORD: lingcoo_app_password
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U lingcoo_app -d lingcoo_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_NAME: lingcoo-app-starter
      APP_VERSION: ci
      API_HOST: 127.0.0.1
      API_PORT: 8090
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      DATABASE_URL: postgres://lingcoo_app:lingcoo_app_password@localhost:5438/lingcoo_app
      API_DOCS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Verify migration idempotency
        run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lingcoo-app-starter:verify
          build-args: |
            APP_VERSION=${{ github.sha }}
